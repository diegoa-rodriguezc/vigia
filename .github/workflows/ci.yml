# CI de VigIA: verifica en una máquina limpia que el código compila y los tests pasan.
# No ejecuta el pipeline de datos (depende de APIs externas y del LLM local): eso se
# reproduce con `make deploy` (ver README) y su plan de contingencia de datos.
name: CI

on:
  push:
    branches: [main, dev-darc]
  pull_request:
    branches: [main]

jobs:
  # Puerta de estilo: linter + formato (Python) y análisis estático (Go). Barato (sin las
  # dependencias pesadas del paquete): solo instala ruff. ruff va FIJADO a la misma minor que el
  # extra `dev` porque `ruff format` puede cambiar de estilo entre minors (CI y local deben coincidir).
  lint:
    name: Linter y formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Instalar ruff (versión fijada, igual que el extra dev)
        run: pip install "ruff>=0.12,<0.13"
      - name: ruff check (ml)
        working-directory: ml
        run: ruff check .
      - name: ruff format --check (ml)
        working-directory: ml
        run: ruff format --check .
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22" # misma versión que go.mod
          cache-dependency-path: backend/go.sum
      - name: go vet (backend)
        working-directory: backend
        run: go vet ./...

  ml:
    name: Tests Python (ml)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11" # misma versión que ml/Dockerfile
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - name: Instalar el paquete (modo editable + dev)
        run: pip install -e ".[dev]"
      # Los tests corren offline por diseño (sin Postgres/Ollama/red).
      # --cov reporta la cobertura como visibilidad (no bloquea: no hay umbral mínimo).
      - name: pytest
        run: pytest -q --cov=vigia --cov-report=term-missing

  backend:
    name: Tests Go (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22" # misma versión que go.mod
          cache-dependency-path: backend/go.sum
      # Los tests de auth usan miniredis: no requieren Redis ni Postgres reales.
      # -cover reporta la cobertura por paquete (visibilidad, no bloquea).
      - name: go test
        run: go test -cover ./...

  frontend:
    name: Tests y build del frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias (reproducible)
        run: npm ci
      - name: vitest
        run: npm test
      - name: Build de producción (tsc + vite)
        run: npm run build

  docker:
    name: Build de imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # El servicio ml declara `env_file: .env`; el de ejemplo basta para el build.
      - name: Preparar .env de ejemplo
        run: cp .env.example .env
      - name: docker compose build
        run: docker compose build
