server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Cabeceras de seguridad del DOCUMENTO (la SPA la publica nginx, no el backend Go: por eso
    #    la CSP va aquí y no en middleware.SecurityHeaders, que solo cubre las respuestas de la API).
    #
    #    Content-Security-Policy, calibrada a los orígenes REALES del tablero:
    #      - script-src 'self'      → el bundle de Vite es same-origin; NO hay scripts inline.
    #      - style-src  'unsafe-inline' → React (style={{}}) y Leaflet (transforms de tiles) inyectan
    #                                     estilos en atributos; + unpkg por el CSS de Leaflet.
    #      - img-src    → tiles del mapa (Carto) + imágenes del CSS de Leaflet (unpkg) + data: (charts).
    #      - connect-src → el backend Go. OJO: debe coincidir con el ORIGEN de VITE_API_BASE_URL;
    #                      si se despliega la API en otro host/puerto, actualiza esta línea (y el build).
    #    Endurecer más (quitar unpkg) es posible auto-alojando el CSS de Leaflet (ver docs).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://*.basemaps.cartocdn.com https://unpkg.com; font-src 'self' data:; connect-src 'self' http://localhost:8080; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # SPA: cualquier ruta no encontrada cae a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
