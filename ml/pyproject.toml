[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vigia"
version = "0.1.0"
description = "VigIA — IA para la seguridad ciudadana y la justicia (Datos al Ecosistema 2026)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # pandas con tope de MAYOR: el salto 2→3 cambió comportamientos (verificado compatible:
    # la suite completa y el backtest reproducen las cifras bajo 3.0); pandas 4 ya anuncia
    # retiros (Pandas4Warning) → no dejar que un build lo resuelva sin verificarlo antes.
    "pandas>=2.1,<4",
    "pyarrow>=14",
    "numpy>=1.26,<3",
    "requests>=2.31",
    "python-dateutil>=2.8",
    "scikit-learn>=1.9,<1.10",
    "joblib>=1.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "pypdf>=4.2",          # extracción de texto de PDF para la KB del RAG
    "python-docx>=1.1",    # extracción de texto de Word (.docx) para la KB del RAG
    "openpyxl>=3.1",       # lectura de los Excel de población municipal del DANE (etl/poblacion.py)
]

[project.optional-dependencies]
# Embeddings locales (alternativa a Ollama) y proveedores gestionados
rag-local = ["sentence-transformers>=2.6"]
anthropic = ["anthropic>=0.25"]
openai = ["openai>=1.20"]
# ruff fijado por minor: `ruff format` puede cambiar de estilo entre minors, así que el
# formato del CI y el local deben coincidir (misma filosofía que el pin de scikit-learn).
dev = ["pytest>=8.0", "pytest-cov>=5", "ruff>=0.12,<0.13", "ipykernel>=6.29"]

[project.scripts]
vigia = "vigia.cli:app"

[tool.setuptools.packages.find]
include = ["vigia*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
